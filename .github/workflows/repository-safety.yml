name: Repository safety

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application-checks:
    name: Lint, build, and privacy tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.13.0"
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Run lint checks
        run: npm run lint

      - name: Create the production build
        run: npm run build

      - name: Run directory privacy and safety tests
        run: node --test tests/directory-safety.test.mjs

  secret-scan:
    name: Scan Git history for exposed secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the complete repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified Gitleaks release
        shell: bash
        run: |
          set -euo pipefail

          readonly version="8.30.1"
          readonly archive="gitleaks_${version}_linux_x64.tar.gz"
          readonly expected_sha256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          readonly download_url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"

          curl --fail --location --silent --show-error \
            "${download_url}" \
            --output "${RUNNER_TEMP}/${archive}"

          echo "${expected_sha256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" gitleaks
          chmod 0755 "${RUNNER_TEMP}/gitleaks"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Scan committed history
        run: gitleaks git --redact --verbose --no-banner .
